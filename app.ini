
[logger]
level=INFO

[relay]
gpio=4
default_switch_delay=180

[files]
runtime=../runtime.ini
schedule=../program.ini
history=../history.dat
history_csv=../history.csv

[history]
max_records=1000

[climate]
initial_temperature=20.5

[debug]
enabled=true
dump_config=false

[thermal]
outside_temperature=5.0
heat_power=0.25
loss_factor=0.01
thermal_mass=8.0

[scheduler]
climate_period=10
thermostat_period=10
history_save_period=60
history_csv_period=300

[schedule]
max_points_per_day=10
default_setpoint=17.000000
